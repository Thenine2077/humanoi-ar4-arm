# ท่าและโปรแกรมของแขน AR4 — แก้ด้วยมือได้ หรือบันทึกท่าด้วย:
#   ros2 run ar_program teach <ชื่อท่า>
#   ros2 run ar_program teach --program <ชื่อโปรแกรม> <ท่า1> <ท่า2> wait=1.0 <ท่า3> ...
# สั่งรัน:  ros2 topic pub --once /arm/run std_msgs/msg/String "{data: <ชื่อโปรแกรม>}"
#
# poses    : มุม joint_1..joint_6 หน่วยเรเดียน
# programs : ลำดับขั้น — ชื่อท่า หรือ {wait: วินาที}
# (ไฟล์นี้ถูกเขียนใหม่ทั้งไฟล์ทุกครั้งที่ teach คอมเมนต์ที่เพิ่มเองจะหาย ยกเว้นส่วนหัวนี้)

poses:
  rest: [0.0, -0.1019, 0.0, 0.0, -0.9103, 0.0]
  look_left: [0.5, -0.1019, 0.0, 0.0, -0.9103, 0.0]
  look_right: [-0.5, -0.1019, 0.0, 0.0, -0.9103, 0.0]
  wrist_up: [0.0, -0.1019, 0.0, 0.0, -0.4, 0.0]
  pick_frot: [-2.2115, 1.3822, -0.6809, -0.0003, 0.0397, -0.0101]
  home: [-2.7938, 1.1387, -0.3319, 1.3505, -0.9064, 0.1461]
  k: [-2.9596, 1.2697, -1.0469, -0.4186, 0.3997, 0.8902]
  to_home_1: [-1.5651, -0.0001, -1.5175, 0.3968, 0.0397, -0.0101]
  to_home_2: [-2.7938, 0.4309, -0.6325, 0.3968, 0.0397, -0.0101]
  to_home_3: [-2.7938, 1.0429, -0.1842, 1.3193, -1.32, -0.0101]
  grip_1: [-2.7934, 1.0426, -0.1842, 1.3185, -1.32, -0.0101]
programs:
  demo: [rest, look_left, look_right, rest]
  nod:
  - rest
  - wrist_up
  - {wait: 0.5}
  - rest
  pick:
  - rest
  - pick_frot
  - home
  - {wait: 1.0}
  - pick_frot
  - home
  - rest
  home: [home]
  '1':
  - home
  - pick_frot
  - {wait: 2.0}
  - home
  movehome: [to_home_1, to_home_2, to_home_3, home, to_home_3, to_home_2, to_home_1]
