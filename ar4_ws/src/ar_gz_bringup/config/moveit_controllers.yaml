# Same as the vendor's ar_moveit_config/config/controllers.yaml in every way, just rewritten in
# ros2_parameters format directly (not via a Python dict), for the same reason as ompl_planning_pipeline.yaml
# — controller_names and joints are lists; passed through a dict, launch_ros turns them into
# !!python/tuple and parsing the whole file breaks (moveit_controller_manager can't find the controller
# when you press Execute, even though Plan already succeeded)
/**:
  ros__parameters:
    moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
    moveit_simple_controller_manager.controller_names:
      - joint_trajectory_controller
    moveit_simple_controller_manager.joint_trajectory_controller.action_ns: follow_joint_trajectory
    moveit_simple_controller_manager.joint_trajectory_controller.type: FollowJointTrajectory
    moveit_simple_controller_manager.joint_trajectory_controller.default: true
    moveit_simple_controller_manager.joint_trajectory_controller.joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
