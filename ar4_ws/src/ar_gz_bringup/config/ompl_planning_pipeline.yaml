# เขียนเป็นไฟล์ YAML ตรงๆ (ไม่ผ่าน Python dict->launch_ros->yaml.dump, กัน !!python/tuple)
#
# โครงสร้างนี้ตรวจสอบจาก source จริงของ moveit_configs_utils (ros-jazzy-moveit-configs-utils
# 2.12.4, ติดตั้งแล้วอ่านโค้ด moveit_configs_builder.py โดยตรง) ไม่ใช่การเดา — พารามิเตอร์
# ของ pipeline เปลี่ยนชื่อ/โครงสร้างระหว่าง ROS 2 Iron (ที่ไฟล์ผู้ขายเขียนไว้) กับเวอร์ชันนี้:
#   - "planning_plugin" (เอกพจน์, string) -> "planning_plugins" (พหูพจน์, list) แล้วนี่คือ
#     สาเหตุจริงที่ move_group รายงาน "Planning plugin name is empty or not defined" —
#     ไม่ใช่เรื่อง namespace/prefix เลย เป็นเรื่องชื่อคีย์เปลี่ยนไปตรงๆ
#   - request_adapters plugin class เปลี่ยนจาก default_planner_request_adapters/*
#     เป็น default_planning_request_adapters/*
#   - เพิ่ม response_adapters (ของใหม่ แยกจาก request_adapters)
#   - พารามิเตอร์ทั้งหมดของ pipeline ต้องอยู่ใต้คีย์ชื่อ "ompl" (ชื่อ pipeline) ไม่ใช่ "move_group"
#
# planner_configs/ar_manipulator ด้านล่าง = คัดลอกค่ามาจาก ar_moveit_config/config/ompl_planning.yaml
# ของผู้ขาย (อ่านอย่างเดียว ไม่ได้แก้ไฟล์นั้น) เพราะไฟล์ต้นฉบับไม่มี planning_plugins/
# request_adapters/response_adapters เลย (เขียนไว้ก่อนที่ MoveIt เวอร์ชันนี้จะต้องใช้คีย์พวกนี้)
/**:
  ros__parameters:
    planning_pipelines:
      - ompl
    default_planning_pipeline: ompl
    ompl:
      planning_plugins:
        - ompl_interface/OMPLPlanner
      request_adapters:
        - default_planning_request_adapters/ResolveConstraintFrames
        - default_planning_request_adapters/ValidateWorkspaceBounds
        - default_planning_request_adapters/CheckStartStateBounds
        - default_planning_request_adapters/CheckStartStateCollision
      response_adapters:
        - default_planning_response_adapters/AddTimeOptimalParameterization
        - default_planning_response_adapters/ValidateSolution
        - default_planning_response_adapters/DisplayMotionPath
      start_state_max_bounds_error: 0.1
      planner_configs:
        SBLkConfigDefault:
          type: geometric::SBL
          range: 0.0
        ESTkConfigDefault:
          type: geometric::EST
          range: 0.0
          goal_bias: 0.05
        LBKPIECEkConfigDefault:
          type: geometric::LBKPIECE
          range: 0.0
          border_fraction: 0.9
          min_valid_path_fraction: 0.5
        BKPIECEkConfigDefault:
          type: geometric::BKPIECE
          range: 0.0
          border_fraction: 0.9
          failed_expansion_score_factor: 0.5
          min_valid_path_fraction: 0.5
        KPIECEkConfigDefault:
          type: geometric::KPIECE
          range: 0.0
          goal_bias: 0.05
          border_fraction: 0.9
          failed_expansion_score_factor: 0.5
          min_valid_path_fraction: 0.5
        RRTkConfigDefault:
          type: geometric::RRT
          range: 0.0
          goal_bias: 0.05
        RRTConnectkConfigDefault:
          type: geometric::RRTConnect
          range: 0.0
        RRTstarkConfigDefault:
          type: geometric::RRTstar
          range: 0.0
          goal_bias: 0.05
          delay_collision_checking: 1
        TRRTkConfigDefault:
          type: geometric::TRRT
          range: 0.0
          goal_bias: 0.05
          max_states_failed: 10
          temp_change_factor: 2.0
          min_temperature: 10e-10
          init_temperature: 10e-6
          frountier_threshold: 0.0
          frountierNodeRatio: 0.1
          k_constant: 0.0
        PRMkConfigDefault:
          type: geometric::PRM
          max_nearest_neighbors: 10
        PRMstarkConfigDefault:
          type: geometric::PRMstar
      ar_manipulator:
        planner_configs:
          - SBLkConfigDefault
          - ESTkConfigDefault
          - LBKPIECEkConfigDefault
          - BKPIECEkConfigDefault
          - KPIECEkConfigDefault
          - RRTkConfigDefault
          - RRTConnectkConfigDefault
          - RRTstarkConfigDefault
          - TRRTkConfigDefault
          - PRMkConfigDefault
          - PRMstarkConfigDefault
        longest_valid_segment_fraction: 0.01
