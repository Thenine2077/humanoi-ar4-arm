# Max velocity / acceleration MoveIt plans with for the real arms (rad/s, rad/s²) — this is what the arm actually runs at with Velocity /
# Acceleration Scaling in RViz = 1.0 (dual_moveit.rviz sets 1.0). Lower scaling = slower; it cannot go above 1.0
#
# 2026-10-29: was the vendor values 30°/s, 10°/s² (= firmware ceiling — at full ceiling the arm could not keep up) with RViz scaling 0.3
#   Now the scaled values are written here directly: 0.157 rad/s (9°/s), 0.0524 rad/s² (3°/s²) — joints 2-6 run exactly as before
#   Joint 1: 0.19 rad/s (10.9°/s) = J1 speed during calibrate, which never slipped; below the board ceiling 11.25 (joint_speed.yaml)
#   The J1 belt has slipped before — never set joint 1 above 0.19 (board can't keep up, controller aborts mid-motion)
joint_limits:
  left_joint_1:
    has_acceleration_limits: true
    max_acceleration: 0.0524
    has_velocity_limits: true
    max_velocity: 0.19
  left_joint_2:
    has_acceleration_limits: true
    max_acceleration: 0.0524
    has_velocity_limits: true
    max_velocity: 0.157
