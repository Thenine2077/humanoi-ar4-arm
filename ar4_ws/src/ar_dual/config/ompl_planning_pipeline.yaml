# Copy of ar_gz_bringup/config/ompl_planning_pipeline.yaml (single arm) — only the group names change
# ar_manipulator -> left_arm / right_arm / both_arms
# Written as a plain YAML file (not via Python dict->launch_ros->yaml.dump, to avoid !!python/tuple)
#
# This structure was verified against the actual source of moveit_configs_utils (ros-jazzy-moveit-configs-utils
# 2.12.4, installed and read moveit_configs_builder.py directly), not guessed — the pipeline parameters
# changed name/structure between ROS 2 Iron (which the vendor files were written for) and this version:
#   - "planning_plugin" (singular, string) -> "planning_plugins" (plural, list), and this is
#     the real reason move_group reported "Planning plugin name is empty or not defined" —
#     not a namespace/prefix issue at all, simply a renamed key
#   - request_adapters plugin class changed from default_planner_request_adapters/*
#     to default_planning_request_adapters/*
#   - added response_adapters (new, separate from request_adapters)
#   - all pipeline parameters must be under the key "ompl" (the pipeline name), not "move_group"
#
# planner_configs/ar_manipulator below = values copied from the vendor's ar_moveit_config/config/ompl_planning.yaml
# (read only, that file was not modified) because the original has no planning_plugins/
# request_adapters/response_adapters at all (written before this MoveIt version required these keys)
/**:
  ros__parameters:
    planning_pipelines:
      - ompl
    default_planning_pipeline: ompl
    ompl:
      planning_plugins:
        - ompl_interface/OMPLPlanner
      request_adapters:
        - default_planning_request_adapters/ResolveConstraintFrames
        - default_planning_request_adapters/ValidateWorkspaceBounds
        - default_planning_request_adapters/CheckStartStateBounds
        - default_planning_request_adapters/CheckStartStateCollision
      response_adapters:
        - default_planning_response_adapters/AddTimeOptimalParameterization
        - default_planning_response_adapters/ValidateSolution
        - default_planning_response_adapters/DisplayMotionPath
      start_state_max_bounds_error: 0.1
      planner_configs:
        SBLkConfigDefault:
          type: geometric::SBL
          range: 0.0
        ESTkConfigDefault:
          type: geometric::EST
          range: 0.0
          goal_bias: 0.05
        LBKPIECEkConfigDefault:
          type: geometric::LBKPIECE
          range: 0.0
          border_fraction: 0.9
          min_valid_path_fraction: 0.5
        BKPIECEkConfigDefault:
          type: geometric::BKPIECE
          range: 0.0
          border_fraction: 0.9
          failed_expansion_score_factor: 0.5
          min_valid_path_fraction: 0.5
        KPIECEkConfigDefault:
          type: geometric::KPIECE
          range: 0.0
          goal_bias: 0.05
          border_fraction: 0.9
          failed_expansion_score_factor: 0.5
          min_valid_path_fraction: 0.5
        RRTkConfigDefault:
          type: geometric::RRT
          range: 0.0
          goal_bias: 0.05
        RRTConnectkConfigDefault:
          type: geometric::RRTConnect
          range: 0.0
        RRTstarkConfigDefault:
          type: geometric::RRTstar
          range: 0.0
          goal_bias: 0.05
          delay_collision_checking: 1
        TRRTkConfigDefault:
          type: geometric::TRRT
          range: 0.0
          goal_bias: 0.05
          max_states_failed: 10
          temp_change_factor: 2.0
          min_temperature: 10e-10
          init_temperature: 10e-6
          frountier_threshold: 0.0
          frountierNodeRatio: 0.1
          k_constant: 0.0
        PRMkConfigDefault:
          type: geometric::PRM
          max_nearest_neighbors: 10
        PRMstarkConfigDefault:
          type: geometric::PRMstar
      left_arm:
        planner_configs:
          - SBLkConfigDefault
          - ESTkConfigDefault
          - LBKPIECEkConfigDefault
          - BKPIECEkConfigDefault
          - KPIECEkConfigDefault
          - RRTkConfigDefault
          - RRTConnectkConfigDefault
          - RRTstarkConfigDefault
          - TRRTkConfigDefault
          - PRMkConfigDefault
          - PRMstarkConfigDefault
        longest_valid_segment_fraction: 0.01
      right_arm:
        planner_configs:
          - SBLkConfigDefault
          - ESTkConfigDefault
          - LBKPIECEkConfigDefault
          - BKPIECEkConfigDefault
          - KPIECEkConfigDefault
          - RRTkConfigDefault
          - RRTConnectkConfigDefault
          - RRTstarkConfigDefault
          - TRRTkConfigDefault
          - PRMkConfigDefault
          - PRMstarkConfigDefault
        longest_valid_segment_fraction: 0.01
      both_arms:
        planner_configs:
          - SBLkConfigDefault
          - ESTkConfigDefault
          - LBKPIECEkConfigDefault
          - BKPIECEkConfigDefault
          - KPIECEkConfigDefault
          - RRTkConfigDefault
          - RRTConnectkConfigDefault
          - RRTstarkConfigDefault
          - TRRTkConfigDefault
          - PRMkConfigDefault
          - PRMstarkConfigDefault
        longest_valid_segment_fraction: 0.01
