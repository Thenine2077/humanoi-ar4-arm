# Separate controller process per arm (launch/arm_hardware.launch.py) — one arm can be stopped/calibrated/restarted while the other keeps working
# The vendor driver opens the Teensy port at startup and holds it until the process exits, so each arm needs its own process (deactivating one arm does not release its port)
# Controller and action names unchanged (/left_arm_controller/follow_joint_trajectory ...) — MoveIt / program player need no changes
# joint_state_broadcaster per arm publishes /<arm>/joint_states, then joint_state_publisher merges them into /joint_states with all 12 joints
# (Gazebo sim still uses controllers.yaml with a single controller manager)
left_controller_manager:
  ros__parameters:
    update_rate: 50
    left_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

right_controller_manager:
  ros__parameters:
    update_rate: 50
    right_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_arm_controller:
  ros__parameters:
    joints:
      - left_joint_1
      - left_joint_2
      - left_joint_3
      - left_joint_4
      - left_joint_5
      - left_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.0
      left_joint_1: { trajectory: 0.2, goal: 0.02 }
      left_joint_2: { trajectory: 0.2, goal: 0.02 }
      left_joint_3: { trajectory: 0.2, goal: 0.02 }
      left_joint_4: { trajectory: 0.2, goal: 0.02 }
      left_joint_5: { trajectory: 0.2, goal: 0.02 }
      left_joint_6: { trajectory: 0.2, goal: 0.02 }

right_arm_controller:
  ros__parameters:
    joints:
      - right_joint_1
      - right_joint_2
      - right_joint_3
      - right_joint_4
      - right_joint_5
      - right_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.0
      right_joint_1: { trajectory: 0.2, goal: 0.02 }
      right_joint_2: { trajectory: 0.2, goal: 0.02 }
      right_joint_3: { trajectory: 0.2, goal: 0.02 }
      right_joint_4: { trajectory: 0.2, goal: 0.02 }
      right_joint_5: { trajectory: 0.2, goal: 0.02 }
      right_joint_6: { trajectory: 0.2, goal: 0.02 }
