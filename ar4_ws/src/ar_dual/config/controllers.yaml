# Controllers for both arms — per-arm values same as the vendor's ar_hardware_interface/config/controllers.yaml (just adds left_/right_)
# update_rate 50 Hz (vendor uses 125 with one arm): every cycle the driver talks to the Teensy with 2 blocking request/replies per arm,
# both arms in sequence in one loop ~6-8 ms — 125 Hz (8 ms) is not enough
controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_arm_controller:
  ros__parameters:
    joints:
      - left_joint_1
      - left_joint_2
      - left_joint_3
      - left_joint_4
      - left_joint_5
      - left_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.0
      left_joint_1: { trajectory: 0.2, goal: 0.02 }
      left_joint_2: { trajectory: 0.2, goal: 0.02 }
      left_joint_3: { trajectory: 0.2, goal: 0.02 }
      left_joint_4: { trajectory: 0.2, goal: 0.02 }
      left_joint_5: { trajectory: 0.2, goal: 0.02 }
      left_joint_6: { trajectory: 0.2, goal: 0.02 }

right_arm_controller:
  ros__parameters:
    joints:
      - right_joint_1
      - right_joint_2
      - right_joint_3
      - right_joint_4
      - right_joint_5
      - right_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.0
      right_joint_1: { trajectory: 0.2, goal: 0.02 }
      right_joint_2: { trajectory: 0.2, goal: 0.02 }
      right_joint_3: { trajectory: 0.2, goal: 0.02 }
      right_joint_4: { trajectory: 0.2, goal: 0.02 }
      right_joint_5: { trajectory: 0.2, goal: 0.02 }
      right_joint_6: { trajectory: 0.2, goal: 0.02 }
