# ตัวคุมสองแขน — ค่าต่อแขนเหมือน ar_hardware_interface/config/controllers.yaml ของผู้ขาย (แค่เติม left_/right_)
# update_rate 50 Hz (ผู้ขายใช้ 125 กับแขนเดียว): ทุกรอบไดรเวอร์คุย Teensy แบบรอคำตอบ 2 ครั้งต่อแขน
# สองแขนเรียงกันใน loop เดียว ~6-8 ms — 125 Hz (8 ms) ไม่พอ
controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_arm_controller:
  ros__parameters:
    joints:
      - left_joint_1
      - left_joint_2
      - left_joint_3
      - left_joint_4
      - left_joint_5
      - left_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.0
      left_joint_1: { trajectory: 0.2, goal: 0.02 }
      left_joint_2: { trajectory: 0.2, goal: 0.02 }
      left_joint_3: { trajectory: 0.2, goal: 0.02 }
      left_joint_4: { trajectory: 0.2, goal: 0.02 }
      left_joint_5: { trajectory: 0.2, goal: 0.02 }
      left_joint_6: { trajectory: 0.2, goal: 0.02 }

right_arm_controller:
  ros__parameters:
    joints:
      - right_joint_1
      - right_joint_2
      - right_joint_3
      - right_joint_4
      - right_joint_5
      - right_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.0
      right_joint_1: { trajectory: 0.2, goal: 0.02 }
      right_joint_2: { trajectory: 0.2, goal: 0.02 }
      right_joint_3: { trajectory: 0.2, goal: 0.02 }
      right_joint_4: { trajectory: 0.2, goal: 0.02 }
      right_joint_5: { trajectory: 0.2, goal: 0.02 }
      right_joint_6: { trajectory: 0.2, goal: 0.02 }
