# ค่าชดเชยศูนย์ข้อต่อที่เก็บในบอร์ด Teensy (เฟิร์มแวร์ AR4_ROS2_seq v3 คำสั่ง JZ) — องศา J1..J6
# มุมที่บอร์ดรายงาน = มุมที่นับจากลิมิตสวิตช์ + ค่านี้ (มุมที่สั่งลบค่านี้ออกก่อนหมุน) -> ตัวเลขในโปรแกรม = มุมจริง
# calibrate / ท่าพัก / ระยะหมุนจริงของแขนไม่เปลี่ยน — เปลี่ยนแค่ตัวเลขที่ใช้เรียกตำแหน่งนั้น
#
# ใช้ร่วมกันทุกที่ (แก้ที่นี่ที่เดียว):
#   บอร์ด      arm zero <แขน> เขียนค่านี้ลงบอร์ด · arm start เช็กว่าบอร์ดตรงกับไฟล์ ไม่ตรงไม่เปิด
#   ลิมิตข้อต่อ ar_arm.xacro / arm_control.xacro / ar_program เลื่อนตามค่านี้ (ช่วงหมุนจริงเท่าเดิม)
# เปลี่ยนค่า = ท่าที่สอนไว้ของแขนนั้นต้องเลื่อนตาม (ข้อนั้น + ค่าที่เพิ่ม) ไม่งั้นท่าเดิมไปผิดที่
#
# 2026-10-26 แขนซ้าย: จัดแต่ละข้อตรงด้วยระดับน้ำ แล้วอ่านค่าในโปรแกรม (ก่อนมีค่าชดเชย)
#   ข้อ 1 +7 · ข้อ 2 +2 · ข้อ 3 0 · ข้อ 4 +7 · ข้อ 5 −19 · ข้อ 6 −15 -> ค่าชดเชย = −ค่าที่อ่าน
left: [-7, -2, 0, -7, 19, 15]
right: [0, 0, 0, 0, 0, 0]

# หลัง arm calibrate เสร็จ ข้อที่เพิ่ง calibrate หมุนต่อไปมุมนี้ ({ข้อ: มุมจริง องศา}) — ไม่ใส่ = อยู่ท่าพักของเฟิร์มแวร์
# (ท่าพักเฟิร์มแวร์ต้นฉบับข้อ 5 งออยู่ ~−33° จริง) · ท่า rest ใน MoveIt / ท่าเริ่มของซิมใช้ค่านี้ด้วย
after_calibrate:
  left: {1: 0, 2: 0, 4: 0, 5: 0, 6: 0}   # ข้อที่วัดตรงด้วยระดับน้ำแล้ว
