# เพดานความเร็ว / ความเร่งของมอเตอร์แต่ละข้อที่ตั้งลงบอร์ด Teensy (คำสั่ง SS) — J1..J6
# หน่วยของเฟิร์มแวร์: °/s และ °/s² (เฟิร์มแวร์คูณ MOTOR_STEPS_PER_DEG เป็นพัลส์ — มุมที่รายงานจริงเร็วกว่านี้ 2.4%)
# บอร์ดเปิดมาใช้ 30°/s, 10°/s² ทุกข้อ และลืมค่าที่ตั้งเมื่อรีบูต (ไฟดับ / แฟลช) จึงตั้งใหม่ทุกครั้ง:
#   arm start / recal / reconnect (ar_zero.py ก่อนเปิดตัวคุม) และ arm calibrate (ar_calibrate.py ก่อนหมุน)
#
# 2026-10-29 J1 เหลือ 11.25 = 500 พัลส์/วินาที เท่าตอน calibrate วิ่งหาสวิตช์ (ผู้ใช้: แทบไม่เคยรูด)
#   ก่อนหน้านี้ J1 วิ่ง 30°/s ตอนกลับท่าพักหลัง calibrate และตอน MoveIt สั่งเร็ว
#   ROS ต้องสั่ง J1 ไม่เกิน 0.19 rad/s (10.9°/s) ให้ต่ำกว่าเพดานนี้ (11.5°/s ที่มุมจริง) ไม่งั้นแขนตามไม่ทัน
#   จนเกิน path tolerance แล้วตัวคุมยกเลิกกลางทาง — ar_program max_speed / ar_dual joint_limits.yaml ตั้งไว้ 0.19
speed: [11.25, 30, 30, 30, 30, 30]
accel: [10, 10, 10, 10, 10, 10]
