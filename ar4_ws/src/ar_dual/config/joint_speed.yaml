# Max motor speed / acceleration per joint, set on the Teensy board (SS command) — J1..J6
# Firmware units: °/s and °/s² (firmware multiplies by MOTOR_STEPS_PER_DEG to get pulses — the reported angle actually moves 2.4% faster)
# The board boots with 30°/s, 10°/s² on every joint and forgets the setting on reboot (power loss / flash), so it is set again every time:
#   arm start / recal / reconnect (ar_zero.py before starting the controller) and arm calibrate (ar_calibrate.py before moving)
#
# 2026-10-29 J1 lowered to 11.25 = 500 pulses/s, same as calibrate's limit-switch search (user: almost never slips)
#   Before this J1 ran at 30°/s when returning to the rest pose after calibrate and when MoveIt commanded fast moves
#   ROS must command J1 at no more than 0.19 rad/s (10.9°/s) to stay below this ceiling (11.5°/s in real angle), otherwise the arm falls behind
#   past the path tolerance and the controller aborts mid-motion — ar_program max_speed / ar_dual joint_limits.yaml are set to 0.19
speed: [11.25, 30, 30, 30, 30, 30]
accel: [10, 10, 10, 10, 10, 10]
