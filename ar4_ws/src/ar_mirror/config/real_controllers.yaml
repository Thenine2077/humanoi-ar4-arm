# Copy of the values from the vendor's ar_hardware_interface/config/controllers.yaml (the original file is not edited)
# 2 differences from the original, because in the dual setup the real-arm side runs under namespace /real:
#
#   1) the top-level key must be the full node name "/real/..." — the vendor uses plain "controller_manager:",
#      which ROS 2 takes as a node in the root namespace only; since the real node is named
#      /real/controller_manager, it sees no parameters at all and the spawner dies with
#      "The 'type' param was not defined for 'joint_state_broadcaster'"
#
#   2) update_rate lowered 100 -> 50 Hz: running alongside Gazebo the loop couldn't keep up, the log was full of
#      "Overrun detected!" (read/write over usbip took 6-22 ms per cycle, over the 10 ms budget)
#      and it ended with serial dropping "End of file" — 50 Hz gives a 20 ms budget per cycle, enough for usbip
/real/controller_manager:
  ros__parameters:
    # Every controller_manager cycle does a serial round-trip "twice", not once
    #   ARHardwareInterface::read()  -> TeensyDriver::getJointPositions() -> sends "JP\n" and waits for the reply
    #   ARHardwareInterface::write() -> TeensyDriver::update()            -> sends "MT...\n" and waits for the reply
    # both are blocking request/response, and TeensyDriver::receive() reads 1 byte at a time until '\n'
    # so the time budget per cycle = 2 × the round-trip time of the link in use
    #
    # Measured (sending "JP\n" at 10 Hz continuously for 60 seconds × 2 runs):
    #   over usbip              25-43 ms per round-trip, and "End of file" drop within ~1 minute
    #   COM opened directly on Windows  1.0 ms per round-trip, 599/599 OK, no timeouts at all
    # 30× difference -> the bottleneck is purely usbip, not the board or the cables
    # Now a serial-over-TCP bridge (tools/serial_bridge_*.py|sh) is used instead of usbip
    # 30 Hz gives a 33 ms/cycle budget, plenty for the bridge's ~2-5 ms, and moves much smoother than 10 Hz
    # if "Overrun detected!" shows up repeatedly, lower it to 20
    update_rate: 30 # Hz

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

/real/joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.0
      joint_1: { trajectory: 0.2, goal: 0.02 }
      joint_2: { trajectory: 0.2, goal: 0.02 }
      joint_3: { trajectory: 0.2, goal: 0.02 }
      joint_4: { trajectory: 0.2, goal: 0.02 }
      joint_5: { trajectory: 0.2, goal: 0.02 }
      joint_6: { trajectory: 0.2, goal: 0.02 }
